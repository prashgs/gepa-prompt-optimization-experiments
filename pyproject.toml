[project]
name = "gepa-experiments"
version = "0.1.0"
description = "GEPA prompt optimization experiments: smaller models vs larger open-weights for business requirement generation"
readme = "README.md"
authors = [
    { name = "prashgs", email = "prashgs@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai[litellm]>=0.120.0",
    "gepa[full]>=0.0.7",
    "json5>=0.12.0",
    "mlflow>=2.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
gepa-prepare-data = "gepa_experiments.scripts.prepare_data:main"
gepa-optimize = "gepa_experiments.scripts.run_optimize:main"
gepa-evaluate = "gepa_experiments.scripts.run_evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gepa_experiments"]
